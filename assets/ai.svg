<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="aiGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="#0D1117"/>
  <rect width="200" height="200" rx="20" fill="none" stroke="url(#aiGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Neural network nodes -->
  <!-- Input layer -->
  <circle cx="40" cy="60" r="10" fill="#161B22" stroke="#58A6FF" stroke-width="2"/>
  <circle cx="40" cy="100" r="10" fill="#161B22" stroke="#58A6FF" stroke-width="2"/>
  <circle cx="40" cy="140" r="10" fill="#161B22" stroke="#58A6FF" stroke-width="2"/>

  <!-- Hidden layer 1 -->
  <circle cx="90" cy="50" r="10" fill="#161B22" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="90" cy="85" r="10" fill="#161B22" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="90" cy="120" r="10" fill="#161B22" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="90" cy="155" r="10" fill="#161B22" stroke="#7C3AED" stroke-width="2"/>

  <!-- Hidden layer 2 -->
  <circle cx="140" cy="65" r="10" fill="#161B22" stroke="#58A6FF" stroke-width="2"/>
  <circle cx="140" cy="100" r="10" fill="#161B22" stroke="#58A6FF" stroke-width="2"/>
  <circle cx="140" cy="135" r="10" fill="#161B22" stroke="#58A6FF" stroke-width="2"/>

  <!-- Output layer -->
  <circle cx="185" cy="85" r="10" fill="#7C3AED" stroke="#7C3AED" stroke-width="2" filter="url(#aiGlow)"/>
  <circle cx="185" cy="115" r="10" fill="#58A6FF" stroke="#58A6FF" stroke-width="2" filter="url(#aiGlow)"/>

  <!-- Connections: input → hidden1 -->
  <line x1="50" y1="60" x2="80" y2="50" stroke="#58A6FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="50" y1="60" x2="80" y2="85" stroke="#58A6FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="50" y1="60" x2="80" y2="120" stroke="#58A6FF" stroke-width="0.8" opacity="0.2"/>
  <line x1="50" y1="100" x2="80" y2="50" stroke="#58A6FF" stroke-width="0.8" opacity="0.2"/>
  <line x1="50" y1="100" x2="80" y2="85" stroke="#58A6FF" stroke-width="0.8" opacity="0.4"/>
  <line x1="50" y1="100" x2="80" y2="120" stroke="#58A6FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="50" y1="100" x2="80" y2="155" stroke="#58A6FF" stroke-width="0.8" opacity="0.2"/>
  <line x1="50" y1="140" x2="80" y2="85" stroke="#58A6FF" stroke-width="0.8" opacity="0.2"/>
  <line x1="50" y1="140" x2="80" y2="120" stroke="#58A6FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="50" y1="140" x2="80" y2="155" stroke="#58A6FF" stroke-width="0.8" opacity="0.4"/>

  <!-- Connections: hidden1 → hidden2 -->
  <line x1="100" y1="50" x2="130" y2="65" stroke="#7C3AED" stroke-width="0.8" opacity="0.3"/>
  <line x1="100" y1="85" x2="130" y2="65" stroke="#7C3AED" stroke-width="0.8" opacity="0.4"/>
  <line x1="100" y1="85" x2="130" y2="100" stroke="#7C3AED" stroke-width="0.8" opacity="0.4"/>
  <line x1="100" y1="120" x2="130" y2="100" stroke="#7C3AED" stroke-width="0.8" opacity="0.4"/>
  <line x1="100" y1="120" x2="130" y2="135" stroke="#7C3AED" stroke-width="0.8" opacity="0.4"/>
  <line x1="100" y1="155" x2="130" y2="135" stroke="#7C3AED" stroke-width="0.8" opacity="0.3"/>

  <!-- Connections: hidden2 → output -->
  <line x1="150" y1="65" x2="175" y2="85" stroke="#58A6FF" stroke-width="1.2" opacity="0.6"/>
  <line x1="150" y1="100" x2="175" y2="85" stroke="#58A6FF" stroke-width="1.2" opacity="0.5"/>
  <line x1="150" y1="100" x2="175" y2="115" stroke="#58A6FF" stroke-width="1.2" opacity="0.5"/>
  <line x1="150" y1="135" x2="175" y2="115" stroke="#58A6FF" stroke-width="1.2" opacity="0.6"/>

  <!-- Label -->
  <text x="100" y="185" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#58A6FF" text-anchor="middle" letter-spacing="2">AI ENGINE</text>
</svg>
