<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="archGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F78166"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="archGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="#0D1117"/>
  <rect width="200" height="200" rx="20" fill="none" stroke="url(#archGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Client box -->
  <rect x="15" y="80" width="50" height="40" rx="6" fill="#161B22" stroke="#58A6FF" stroke-width="1.5"/>
  <text x="40" y="97" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#58A6FF" text-anchor="middle">CLIENT</text>
  <text x="40" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="7" fill="#8B949E" text-anchor="middle">Browser/App</text>

  <!-- API Gateway box -->
  <rect x="75" y="55" width="50" height="40" rx="6" fill="#161B22" stroke="#F78166" stroke-width="1.5"/>
  <text x="100" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#F78166" text-anchor="middle">API GW</text>
  <text x="100" y="85" font-family="'Segoe UI', system-ui, sans-serif" font-size="7" fill="#8B949E" text-anchor="middle">Gateway</text>

  <!-- Services box -->
  <rect x="75" y="105" width="50" height="40" rx="6" fill="#161B22" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="100" y="122" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#7C3AED" text-anchor="middle">SERVICES</text>
  <text x="100" y="135" font-family="'Segoe UI', system-ui, sans-serif" font-size="7" fill="#8B949E" text-anchor="middle">Microservices</text>

  <!-- Database box -->
  <rect x="135" y="55" width="50" height="40" rx="6" fill="#161B22" stroke="#3FB950" stroke-width="1.5"/>
  <text x="160" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#3FB950" text-anchor="middle">DATABASE</text>
  <text x="160" y="85" font-family="'Segoe UI', system-ui, sans-serif" font-size="7" fill="#8B949E" text-anchor="middle">PostgreSQL</text>

  <!-- AI/LLM box -->
  <rect x="135" y="105" width="50" height="40" rx="6" fill="#161B22" stroke="#58A6FF" stroke-width="1.5"/>
  <text x="160" y="122" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#58A6FF" text-anchor="middle">AI / LLM</text>
  <text x="160" y="135" font-family="'Segoe UI', system-ui, sans-serif" font-size="7" fill="#8B949E" text-anchor="middle">Bedrock</text>

  <!-- Arrows -->
  <!-- Client → API GW -->
  <line x1="65" y1="95" x2="75" y2="80" stroke="#58A6FF" stroke-width="1.2" opacity="0.7"/>
  <polygon points="75,80 70,87 78,85" fill="#58A6FF" opacity="0.7"/>

  <!-- Client → Services -->
  <line x1="65" y1="105" x2="75" y2="118" stroke="#58A6FF" stroke-width="1.2" opacity="0.5"/>
  <polygon points="75,118 68,113 72,121" fill="#58A6FF" opacity="0.5"/>

  <!-- API GW → Database -->
  <line x1="125" y1="75" x2="135" y2="75" stroke="#F78166" stroke-width="1.2" opacity="0.7"/>
  <polygon points="135,75 128,71 128,79" fill="#F78166" opacity="0.7"/>

  <!-- Services → AI/LLM -->
  <line x1="125" y1="125" x2="135" y2="125" stroke="#7C3AED" stroke-width="1.2" opacity="0.7"/>
  <polygon points="135,125 128,121 128,129" fill="#7C3AED" opacity="0.7"/>

  <!-- API GW ↔ Services vertical -->
  <line x1="100" y1="95" x2="100" y2="105" stroke="#30363D" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Database ↔ AI vertical -->
  <line x1="160" y1="95" x2="160" y2="105" stroke="#30363D" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Label -->
  <text x="100" y="165" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#F78166" text-anchor="middle" letter-spacing="1">ARCHITECTURE</text>
</svg>
