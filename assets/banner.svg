<svg width="1500" height="400" viewBox="0 0 1500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1500" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="80" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F6FC"/>
      <stop offset="100%" stop-color="#C9D1D9"/>
    </linearGradient>
    <linearGradient id="glowBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="textGlow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Dot grid pattern -->
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#58A6FF" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1500" height="400" fill="url(#bgGrad)"/>

  <!-- Dot grid texture (full width) -->
  <rect width="1500" height="400" fill="url(#dotGrid)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="900" cy="200" rx="500" ry="200" fill="#7C3AED" opacity="0.04"/>
  <ellipse cx="200" cy="300" rx="300" ry="150" fill="#58A6FF" opacity="0.04"/>
  <ellipse cx="1400" cy="100" rx="200" ry="150" fill="#58A6FF" opacity="0.03"/>

  <!-- Top gradient accent bar -->
  <rect x="0" y="0" width="1500" height="3" fill="url(#accentGrad)" opacity="1"/>

  <!-- Bottom gradient accent bar -->
  <rect x="0" y="397" width="1500" height="3" fill="url(#accentGrad)" opacity="0.5"/>

  <!-- Left vertical accent line -->
  <rect x="56" y="50" width="2" height="300" rx="1" fill="url(#accentGrad)" opacity="0.6"/>

  <!-- ── CONTENT ── -->

  <!-- Status badge -->
  <rect x="76" y="58" width="186" height="28" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <circle cx="97" cy="72" r="5" fill="#3FB950"/>
  <circle cx="97" cy="72" r="3" fill="#AAFFAA" opacity="0.6"/>
  <text x="112" y="77" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#8B949E" letter-spacing="1.8">AVAILABLE TO WORK</text>

  <!-- Name -->
  <text x="76" y="168" font-family="'Segoe UI', system-ui, sans-serif" font-size="76" font-weight="800" fill="url(#titleGrad)" filter="url(#textGlow)">Suraj Kumar</text>

  <!-- Role line -->
  <text x="78" y="218" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="600" fill="#58A6FF">AI Backend Engineer</text>

  <!-- Underline accent under role -->
  <rect x="78" y="226" width="260" height="2.5" rx="1.5" fill="url(#accentGrad)" opacity="0.7"/>

  <!-- Subtitle -->
  <text x="78" y="264" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#8B949E" letter-spacing="0.4">Building Intelligent Enterprise Systems  ·  India</text>

  <!-- Tech pills -->
  <!-- Laravel -->
  <rect x="78" y="292" width="96" height="30" rx="15" fill="#1C1F26" stroke="#30363D" stroke-width="1"/>
  <text x="126" y="312" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#FF2D20" text-anchor="middle">Laravel</text>

  <!-- Python -->
  <rect x="184" y="292" width="90" height="30" rx="15" fill="#1C1F26" stroke="#30363D" stroke-width="1"/>
  <text x="229" y="312" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#3776AB" text-anchor="middle">Python</text>

  <!-- AWS -->
  <rect x="284" y="292" width="72" height="30" rx="15" fill="#1C1F26" stroke="#30363D" stroke-width="1"/>
  <text x="320" y="312" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#FF9900" text-anchor="middle">AWS</text>

  <!-- GraphQL -->
  <rect x="366" y="292" width="100" height="30" rx="15" fill="#1C1F26" stroke="#30363D" stroke-width="1"/>
  <text x="416" y="312" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#E10098" text-anchor="middle">GraphQL</text>

  <!-- LLMs -->
  <rect x="476" y="292" width="72" height="30" rx="15" fill="#1C1F26" stroke="#30363D" stroke-width="1"/>
  <text x="512" y="312" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#7C3AED" text-anchor="middle">LLMs</text>

  <!-- RAG -->
  <rect x="558" y="292" width="64" height="30" rx="15" fill="#1C1F26" stroke="#30363D" stroke-width="1"/>
  <text x="590" y="312" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#58A6FF" text-anchor="middle">RAG</text>

  <!-- Bottom tagline -->
  <text x="78" y="368" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#3FB950" letter-spacing="0.3" opacity="0.9">✦ Enterprise SaaS  ·  AI Agents  ·  Text-to-SQL  ·  Cloud Architecture  ·  Distributed Systems</text>

  <!-- ── RIGHT SIDE: Clean geometric decoration ── -->

  <!-- Large faint circle -->
  <circle cx="1200" cy="200" r="220" stroke="#58A6FF" stroke-width="0.6" fill="none" opacity="0.08"/>
  <circle cx="1200" cy="200" r="170" stroke="#7C3AED" stroke-width="0.6" fill="none" opacity="0.08"/>
  <circle cx="1200" cy="200" r="120" stroke="#58A6FF" stroke-width="0.6" fill="none" opacity="0.08"/>

  <!-- Floating code-like text blocks (decorative) -->
  <rect x="980" y="80" width="180" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" opacity="0.7"/>
  <text x="990" y="96" font-family="'Courier New', monospace" font-size="11" fill="#58A6FF" opacity="0.6">const ai = new Agent();</text>

  <rect x="1020" y="118" width="200" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" opacity="0.7"/>
  <text x="1030" y="134" font-family="'Courier New', monospace" font-size="11" fill="#3FB950" opacity="0.6">await ai.run(userQuery);</text>

  <rect x="1000" y="156" width="160" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" opacity="0.7"/>
  <text x="1010" y="172" font-family="'Courier New', monospace" font-size="11" fill="#7C3AED" opacity="0.6">return sql.execute();</text>

  <rect x="1040" y="194" width="140" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" opacity="0.7"/>
  <text x="1050" y="210" font-family="'Courier New', monospace" font-size="11" fill="#F78166" opacity="0.6">deploy(aws.lambda);</text>

  <rect x="990" y="232" width="190" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" opacity="0.7"/>
  <text x="1000" y="248" font-family="'Courier New', monospace" font-size="11" fill="#58A6FF" opacity="0.6">rag.retrieve(context);</text>

  <rect x="1030" y="270" width="170" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" opacity="0.7"/>
  <text x="1040" y="286" font-family="'Courier New', monospace" font-size="11" fill="#3FB950" opacity="0.6">graph.query(schema);</text>

  <!-- Vertical connector lines between code blocks -->
  <line x1="1100" y1="102" x2="1100" y2="118" stroke="#30363D" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="1100" y1="140" x2="1100" y2="156" stroke="#30363D" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="1100" y1="178" x2="1100" y2="194" stroke="#30363D" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="1100" y1="216" x2="1100" y2="232" stroke="#30363D" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="1100" y1="254" x2="1100" y2="270" stroke="#30363D" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>

  <!-- Accent dots on right side -->
  <circle cx="1380" cy="120" r="4" fill="#58A6FF" opacity="0.5"/>
  <circle cx="1420" cy="200" r="3" fill="#7C3AED" opacity="0.5"/>
  <circle cx="1390" cy="280" r="4" fill="#3FB950" opacity="0.5"/>
  <circle cx="1350" cy="160" r="2.5" fill="#F78166" opacity="0.4"/>
  <circle cx="1440" cy="300" r="2.5" fill="#58A6FF" opacity="0.3"/>

</svg>
