<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="beGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
    <filter id="beGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="#0D1117"/>
  <rect width="200" height="200" rx="20" fill="none" stroke="url(#beGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Server rack 1 (top) -->
  <rect x="30" y="30" width="140" height="36" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <rect x="38" y="38" width="60" height="20" rx="3" fill="#0D1117"/>
  <!-- Server lights -->
  <circle cx="115" cy="48" r="4" fill="#3FB950" filter="url(#beGlow)"/>
  <circle cx="130" cy="48" r="4" fill="#58A6FF"/>
  <circle cx="145" cy="48" r="4" fill="#30363D"/>
  <circle cx="160" cy="48" r="4" fill="#3FB950" filter="url(#beGlow)"/>
  <!-- Server text -->
  <text x="68" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#58A6FF" text-anchor="middle">API SERVER</text>

  <!-- Server rack 2 (middle) -->
  <rect x="30" y="82" width="140" height="36" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <rect x="38" y="90" width="60" height="20" rx="3" fill="#0D1117"/>
  <circle cx="115" cy="100" r="4" fill="#58A6FF" filter="url(#beGlow)"/>
  <circle cx="130" cy="100" r="4" fill="#3FB950"/>
  <circle cx="145" cy="100" r="4" fill="#58A6FF" filter="url(#beGlow)"/>
  <circle cx="160" cy="100" r="4" fill="#30363D"/>
  <text x="68" y="104" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#3FB950" text-anchor="middle">DATABASE</text>

  <!-- Server rack 3 (bottom) -->
  <rect x="30" y="134" width="140" height="36" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <rect x="38" y="142" width="60" height="20" rx="3" fill="#0D1117"/>
  <circle cx="115" cy="152" r="4" fill="#7C3AED" filter="url(#beGlow)"/>
  <circle cx="130" cy="152" r="4" fill="#58A6FF"/>
  <circle cx="145" cy="152" r="4" fill="#3FB950" filter="url(#beGlow)"/>
  <circle cx="160" cy="152" r="4" fill="#7C3AED"/>
  <text x="68" y="156" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#7C3AED" text-anchor="middle">CACHE/QUEUE</text>

  <!-- Connecting lines between racks -->
  <line x1="100" y1="66" x2="100" y2="82" stroke="#30363D" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="100" y1="118" x2="100" y2="134" stroke="#30363D" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Label -->
  <text x="100" y="190" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#3FB950" text-anchor="middle" letter-spacing="2">BACKEND</text>
</svg>
