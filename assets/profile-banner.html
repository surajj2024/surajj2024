<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Suraj Kumar Banner</title>
    <style>
        body {
            margin: 0;
            background: #0D1117;
            color: #F0F6FC;
            font-family: Inter, Arial, sans-serif;
        }

        .container {
            width: 1500px;
            height: 500px;
            background: linear-gradient(135deg, #0D1117, #161B22);
            position: relative;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: #58A6FF22;
            right: -100px;
            top: -100px;
        }

        .circle2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: #7C3AED22;
            bottom: -150px;
            right: 150px;
        }

        .content {
            padding: 80px;
        }

        h1 {
            font-size: 68px;
            margin: 0;
        }

        h2 {
            color: #58A6FF;
            margin-top: 15px;
        }

        .tag {
            display: inline-block;
            background: #21262D;
            padding: 10px 18px;
            border-radius: 10px;
            margin-right: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="circle"></div>
        <div class="circle2"></div>

        <div class="content">

            <h1>Suraj Kumar</h1>

            <h2>AI Backend Engineer</h2>

            <p>Building Intelligent Enterprise Systems</p>

            <div class="tag">Laravel</div>
            <div class="tag">Python</div>
            <div class="tag">AWS</div>
            <div class="tag">GraphQL</div>
            <div class="tag">LLMs</div>

        </div>

    </div>

</body>

</html>
