name: 📊 GitHub Metrics

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    name: Generate GitHub Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📊 Generate Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          # Use the built-in GITHUB_TOKEN — no extra secret needed
          token: ${{ secrets.GITHUB_TOKEN }}
          user: surajj2024
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          config_output: svg
          config_display: large

          # Languages plugin
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_colors: github

          # Isometric calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Coding habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Lines of code
          plugin_lines: yes

          # Follow-up on issues/PRs
          plugin_followup: yes

          # Starred repos
          plugin_stars: yes
          plugin_stars_limit: 4

          # Topics
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: starred

          # Output file committed back to repo
          filename: assets/metrics.svg
          committer_message: "chore: update metrics [skip ci]"
          committer_branch: main
